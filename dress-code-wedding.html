      <h1 class="section-title">Garden Cocktail Attire</h1>
      <div class="dress-code-content">
        <img src="assets/saturday.jpg" alt="Wedding dress code inspiration" class="dress-code-image">
        <p class="dress-code-text">
          The event will take place outdoors on a grass lawn and inside the museum. 
          Suits, festive dresses in elevated fabrics, saris and lehengas are all appropriate. 
          Both western and Indian attire are welcome!
